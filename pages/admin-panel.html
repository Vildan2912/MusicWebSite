<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyzON - Админ панель</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/player.css">
    <style>
        .admin-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 20px 40px;
        }
        
        .admin-header {
            background: linear-gradient(135deg, #fafaff, #f5f0ff);
            border-radius: 32px;
            padding: 32px;
            margin-bottom: 32px;
            border: 1px solid rgba(124, 58, 237, 0.1);
        }
        
        .admin-header h1 {
            font-size: 32px;
            color: #1e1a2f;
            margin-bottom: 8px;
        }
        
        .admin-header p {
            color: #7c3aed;
        }
        
        .admin-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            border-bottom: 2px solid #e9e9ff;
            flex-wrap: wrap;
        }
        
        .admin-tab {
            background: none;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: #8b8a9e;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        
        .admin-tab.active {
            color: #7c3aed;
            border-bottom-color: #7c3aed;
        }
        
        .admin-tab:hover {
            color: #7c3aed;
        }
        
        .admin-content {
            display: none;
        }
        
        .admin-content.active {
            display: block;
        }
        
        /* Таблицы */
        .data-table {
            background: white;
            border-radius: 24px;
            overflow-x: auto;
            border: 1px solid rgba(124, 58, 237, 0.1);
        }
        
        .data-table table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        
        .data-table th {
            text-align: left;
            padding: 16px 20px;
            background: #fafaff;
            color: #5b21b6;
            font-weight: 600;
            font-size: 13px;
        }
        
        .data-table td {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0ff;
            color: #1e1a2f;
        }
        
        .data-table tr:hover {
            background: #fafaff;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-approved {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status-pending {
            background: #fff3e0;
            color: #e65100;
        }
        
        .status-rejected {
            background: #ffebee;
            color: #c62828;
        }
        
        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: #e9e9ff;
            color: #5b21b6;
        }
        
        .role-artist {
            background: #e8eaf6;
            color: #3949ab;
        }
        
        .role-admin {
            background: #fce4ec;
            color: #c62828;
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            margin: 0 4px;
        }
        
        .btn-approve {
            background: #2e7d32;
        }
        
        .btn-approve:hover {
            background: #1b5e20;
        }
        
        .btn-reject {
            background: #c62828;
        }
        
        .btn-reject:hover {
            background: #b71c1c;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stats-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(124, 58, 237, 0.1);
        }
        
        .stats-card .value {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .stats-card .label {
            color: #8b8a9e;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .track-cover-small {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }
        
        @media (max-width: 768px) {
            .admin-tabs {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">MyzON</div>
        <nav>
            <a href="../index.html">Главная</a>
            <a href="music.html">Каталог</a>
            <a href="listener-cabinet.html">Плейлисты</a>
            <a href="profile.html">Профиль</a>
        </nav>
        <div id="authButtons"></div>
    </header>

    <section class="admin-section">
        <div class="admin-header">
            <h1>🔐 Административная панель</h1>
            <p>Управление пользователями, модерация треков и статистика</p>
        </div>
        
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="dashboard">📊 Дашборд</button>
            <button class="admin-tab" data-tab="tracks">🎵 Модерация треков</button>
            <button class="admin-tab" data-tab="users">👥 Пользователи</button>
        </div>
        
        <!-- Вкладка Дашборд -->
        <div id="tab-dashboard" class="admin-content active">
            <div class="stats-grid" id="dashboardStats">
                <div class="stats-card">
                    <div class="value" id="statTotalUsers">0</div>
                    <div class="label">Всего пользователей</div>
                </div>
                <div class="stats-card">
                    <div class="value" id="statTotalArtists">0</div>
                    <div class="label">Артистов</div>
                </div>
                <div class="stats-card">
                    <div class="value" id="statTotalTracks">0</div>
                    <div class="label">Всего треков</div>
                </div>
                <div class="stats-card">
                    <div class="value" id="statPendingTracks">0</div>
                    <div class="label">На модерации</div>
                </div>
            </div>
        </div>
        
        <!-- Вкладка Модерация треков -->
        <div id="tab-tracks" class="admin-content">
            <div class="data-table" id="moderationTable">
                <div class="empty-state" style="padding: 40px;">Загрузка...</div>
            </div>
        </div>
        
        <!-- Вкладка Пользователи -->
        <div id="tab-users" class="admin-content">
            <div class="data-table" id="usersTable">
                <div class="empty-state" style="padding: 40px;">Загрузка...</div>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 MyzON. Все права защищены.</p>
    </footer>

    <script src="../js/utils/helpers.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/tracks.js"></script>
    <script src="../js/playlists.js"></script>
    <script src="../js/components/player.js"></script>
    <script src="../js/main.js"></script>
    
    <script>
        // Ключи для хранения данных
        const PENDING_TRACKS_KEY = 'myzon_pending_tracks';
        
        function checkAdminAccess() {
            if (!AuthService.isAuthenticated()) {
                window.location.href = 'login.html';
                return false;
            }
            
            const user = AuthService.getUser();
            if (user.role !== 'admin') {
                alert('Доступ запрещён. Только для администраторов.');
                window.location.href = '../index.html';
                return false;
            }
            
            return true;
        }
        
        // Получить треки на модерации
        function getPendingTracks() {
            const pending = JSON.parse(localStorage.getItem(PENDING_TRACKS_KEY) || '[]');
            return pending;
        }
        
        // Сохранить треки на модерации
        function savePendingTracks(tracks) {
            localStorage.setItem(PENDING_TRACKS_KEY, JSON.stringify(tracks));
        }
        
        // Одобрить трек
        function approveTrack(trackId) {
            const pending = getPendingTracks();
            const track = pending.find(t => t.id === trackId);
            
            if (track) {
                // Удаляем из pending
                const newPending = pending.filter(t => t.id !== trackId);
                savePendingTracks(newPending);
                
                // Добавляем в общий список треков
                const allTracks = TracksService.getAllTracks();
                const newTrack = {
                    ...track,
                    status: 'approved',
                    approvedAt: new Date().toISOString()
                };
                
                // Сохраняем как пользовательский трек
                const userTracks = JSON.parse(localStorage.getItem('myzon_tracks') || '[]');
                userTracks.push(newTrack);
                localStorage.setItem('myzon_tracks', JSON.stringify(userTracks));
                
                alert('✅ Трек одобрен и опубликован!');
                loadModerationTable();
                updateDashboardStats();
            }
        }
        
        // Отклонить трек
        function rejectTrack(trackId) {
            if (confirm('Отклонить этот трек?')) {
                const pending = getPendingTracks();
                const newPending = pending.filter(t => t.id !== trackId);
                savePendingTracks(newPending);
                
                alert('❌ Трек отклонён');
                loadModerationTable();
                updateDashboardStats();
            }
        }
        
        // Изменить роль пользователя
        function changeUserRole(userId, newRole) {
            const users = AuthService.getUsers();
            const userIndex = users.findIndex(u => u.id === userId);
            
            if (userIndex !== -1) {
                users[userIndex].role = newRole;
                AuthService.saveUsers(users);
                alert(`✅ Роль пользователя изменена на ${newRole === 'artist' ? 'Артист' : newRole === 'admin' ? 'Админ' : 'Слушатель'}`);
                loadUsersTable();
                updateDashboardStats();
            }
        }
        
        // Загрузить дашборд
        function updateDashboardStats() {
            const users = AuthService.getUsers();
            const allTracks = TracksService.getAllTracks();
            const pendingTracks = getPendingTracks();
            
            const artists = users.filter(u => u.role === 'artist');
            
            document.getElementById('statTotalUsers').textContent = users.length;
            document.getElementById('statTotalArtists').textContent = artists.length;
            document.getElementById('statTotalTracks').textContent = allTracks.length;
            document.getElementById('statPendingTracks').textContent = pendingTracks.length;
        }
        
        // Загрузить таблицу модерации
        function loadModerationTable() {
            const container = document.getElementById('moderationTable');
            const pendingTracks = getPendingTracks();
            
            if (pendingTracks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 40px;">
                        <h3>✅ Нет треков на модерации</h3>
                        <p>Все треки проверены</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Обложка</th>
                            <th>Название</th>
                            <th>Исполнитель</th>
                            <th>Жанр</th>
                            <th>Длительность</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${pendingTracks.map(track => `
                            <tr>
                                <td>
                                    <img src="${track.cover}" class="track-cover-small" onerror="this.src='../assets/covers/cover.jpg'">
                                </td>
                                <td><strong>${escapeHtml(track.title)}</strong></td>
                                <td>${escapeHtml(track.artist)}</td>
                                <td>${track.genre}</td>
                                <td>${track.duration}</td>
                                <td>
                                    <button class="btn btn-sm btn-approve" onclick="approveTrack(${track.id})">✅ Одобрить</button>
                                    <button class="btn btn-sm btn-reject" onclick="rejectTrack(${track.id})">❌ Отклонить</button>
                                </td>
                            </td>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        // Загрузить таблицу пользователей
        function loadUsersTable() {
            const container = document.getElementById('usersTable');
            const users = AuthService.getUsers();
            const currentUser = AuthService.getUser();
            
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Email</th>
                            <th>Роль</th>
                            <th>Дата регистрации</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(user => `
                            <tr>
                                <td>${user.id}</td>
                                <td><strong>${escapeHtml(user.username)}</strong></td>
                                <td>${escapeHtml(user.email)}</td>
                                <td>
                                    <span class="role-badge ${user.role === 'artist' ? 'role-artist' : user.role === 'admin' ? 'role-admin' : ''}">
                                        ${user.role === 'artist' ? '🎤 Артист' : user.role === 'admin' ? '👑 Админ' : '🎧 Слушатель'}
                                    </span>
                                </td>
                                <td>${new Date(user.createdAt).toLocaleDateString('ru-RU')}</td>
                                <td>
                                    ${user.id !== currentUser?.id ? `
                                        <select id="role-select-${user.id}" class="btn-sm" style="padding: 4px 8px;">
                                            <option value="listener" ${user.role === 'listener' ? 'selected' : ''}>Слушатель</option>
                                            <option value="artist" ${user.role === 'artist' ? 'selected' : ''}>Артист</option>
                                            <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Админ</option>
                                        </select>
                                        <button class="btn-sm" onclick="changeUserRole(${user.id}, document.getElementById('role-select-${user.id}').value)">💾</button>
                                    ` : '<span style="color:#8b8a9e;">(вы)</span>'}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        // Инициализация вкладок
        function setupTabs() {
            const tabs = document.querySelectorAll('.admin-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    document.querySelectorAll('.admin-content').forEach(content => {
                        content.classList.remove('active');
                    });
                    
                    const tabId = `tab-${tab.dataset.tab}`;
                    document.getElementById(tabId).classList.add('active');
                    
                    if (tab.dataset.tab === 'tracks') {
                        loadModerationTable();
                    } else if (tab.dataset.tab === 'users') {
                        loadUsersTable();
                    } else if (tab.dataset.tab === 'dashboard') {
                        updateDashboardStats();
                    }
                });
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            if (!checkAdminAccess()) return;
            
            updateAuthUI();
            updateDashboardStats();
            setupTabs();
        });
    </script>
</body>
</html>
